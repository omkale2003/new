name: Move existing deployment to clients
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -eu
            for environment in dev stage; do
              base="/var/www/konkantrip/$environment"
              test -w "$base/clients"
              test "$(cat "$base/frontend/dist/version.txt")" = '8c265f73127cad368bb76632d5d3b9fd89291b99'
              test ! -e "$base/clients/dist"
              cp -a "$base/frontend/dist" "$base/clients/dist"
              site="https://${environment}clients.konkantrip.com"
              test "$(curl --fail --silent --show-error "$site/version.txt")" = '8c265f73127cad368bb76632d5d3b9fd89291b99'
              curl --fail --silent --show-error "$site/" | grep -q '<div id="root">'
              curl --fail --silent --show-error "$site/login" | grep -q '<div id="root">'
              pm2 delete "konkantrip-$environment-frontend"
              echo "$site is now served from clients/dist"
            done
            pm2 save
